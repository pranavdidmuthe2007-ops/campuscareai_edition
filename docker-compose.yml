services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campuscare-backend
    env_file:
      - ./backend/.env
    ports:
      - "8001:8001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/campuscare.db:/app/campuscare.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: nginx:1.27-alpine
    container_name: campuscare-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./build/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
